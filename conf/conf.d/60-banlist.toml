###############################################################################
# Banlist adapted from the operational postfilter-ng banlist.conf.
#
# The previous colon-separated format was:
#   HEADER_REGEX:VALUE_REGEX:ACTION:ARGUMENT:CLIENT_TEXT:ADMIN_COMMENT
#
# The new format keeps each component explicit.  `any.header` is intentionally
# used for migrated rules so matching remains identical even when the From field
# contains only a display name or a malformed address.  New rules should prefer
# parsed targets such as from.address whenever possible.
#
# Actions available to rules:
#   log, reject, drop, save, score, set_score_limit, add_metric,
#   set_article_config
#
# `drop` returns INN's documented DROP response in enforce mode.  During
# audit it is recorded as would-discard while the article is accepted.
#
# Ban rules are shared between text and binary articles unless `article_types`
# is present.  Identity and abusive-client rules below remain shared on purpose.
# A rule inspecting prose or a binary segment naming convention should normally
# declare `article_types = ["text"]` or `["binary"]` respectively.  This field
# controls where the rule is evaluated; it does not alter article classification.
###############################################################################

[[ban_rule]]
id = "from-steve-carroll-normalized-variants"
enabled = true
priority = 2000
description = "Normalized mailbox rule covering Steve Carroll spelling variants."
target = "from.address"
match_type = "regex"
pattern = '^stev(?:e)?carrol{1,2}@nospam\.none$'
case_sensitive = false
action = "reject"
reason_code = "PF-RULE-201"
legacy_code = 34
response = "Posting rejected by local policy"
save_article = true
log_match = true
exclude_profiles = ["administrators", "operational-admin-identities"]

[[ban_rule]]
id = "block-user-agent-newssync"
enabled = true
priority = 1000
description = 'NewsSync is a known spam bot'
target = "any.header"
header_name_pattern = 'User-Agent'
header_value_pattern = 'newsSync'
match_type = "regex"
case_sensitive = false
action = "drop"
output_type = "syslog"
reason_code = "PF-RULE-034"
legacy_code = 34
response = 'Article posted through newsSync'
save_article = true
log_match = true
exclude_profiles = ["administrators", "operational-admin-identities"]

