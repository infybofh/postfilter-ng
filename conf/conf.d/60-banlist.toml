###############################################################################
# Disabled reference examples.  They document every historical action without
# changing the operational policy.  Copy, rename and enable only after testing.
###############################################################################

[[ban_rule]]
id = "example-score-body"
enabled = false
priority = 100
description = "Add five points to the named score when the body matches."
target = "body"
match_type = "regex"
pattern = 'example spam phrase'
action = "score"
score_variable = "spam"
score_value = 5

[[ban_rule]]
id = "example-setmax-score"
enabled = false
priority = 200
description = "Reject with legacy code 49 when score spam exceeds ten."
target = "body"
match_type = "regex"
pattern = '.*'
action = "set_score_limit"
score_variable = "spam"
score_limit = 10

[[ban_rule]]
id = "example-sum-groups"
enabled = false
priority = 150
description = "Add the number of target groups to a named accumulator."
target = "newsgroups"
match_type = "regex"
pattern = '.*'
action = "add_metric"
score_variable = "fanout"
metric = "groups"

[[ban_rule]]
id = "example-save-without-reject"
enabled = false
priority = 100
description = "Save a matching article for inspection but do not reject it."
target = "subject"
match_type = "regex"
pattern = 'suspicious phrase'
action = "save"
save_article = true

[[ban_rule]]
id = "example-runtime-config-override"
enabled = false
priority = 100
description = "Per-article per-article configuration override."
target = "auth.user"
match_type = "exact"
pattern = "special-user"
action = "set_article_config"
config_key = "limits.max_crosspost"
config_value = 20

